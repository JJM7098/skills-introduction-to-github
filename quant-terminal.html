/* ------------------------------------------------------------------ */
/*  Indicator math — all computed client-side from one OHLCV pull      */
/* ------------------------------------------------------------------ */

const sma = (vals, p) =>
  vals.map((_, i) =>
    i < p - 1 ? null : vals.slice(i - p + 1, i + 1).reduce((a, b) => a + b, 0) / p
  );

const ema = (vals, p) => {
  const k = 2 / (p + 1);
  const out = new Array(vals.length).fill(null);
  let prev = null;
  for (let i = 0; i < vals.length; i++) {
    if (i < p - 1) continue;
    if (i === p - 1) {
      prev = vals.slice(0, p).reduce((a, b) => a + b, 0) / p;
    } else {
      prev = vals[i] * k + prev * (1 - k);
    }
    out[i] = prev;
  }
  return out;
};

const rsi = (vals, p = 14) => {
  const out = new Array(vals.length).fill(null);
  let gain = 0, loss = 0;
  for (let i = 1; i < vals.length; i++) {
    const ch = vals[i] - vals[i - 1];
    const g = Math.max(ch, 0), l = Math.max(-ch, 0);
    if (i <= p) {
      gain += g; loss += l;
      if (i === p) {
        gain /= p; loss /= p;
        out[i] = 100 - 100 / (1 + (loss === 0 ? 100 : gain / loss));
      }
    } else {
      gain = (gain * (p - 1) + g) / p;
      loss = (loss * (p - 1) + l) / p;
      out[i] = 100 - 100 / (1 + (loss === 0 ? 100 : gain / loss));
    }
  }
  return out;
};

const macd = (vals) => {
  const e12 = ema(vals, 12), e26 = ema(vals, 26);
  const line = vals.map((_, i) =>
    e12[i] != null && e26[i] != null ? e12[i] - e26[i] : null
  );
  const valid = line.filter((v) => v != null);
  const sig9 = ema(valid, 9);
  const signal = new Array(vals.length).fill(null);
  let j = 0;
  for (let i = 0; i < line.length; i++) if (line[i] != null) signal[i] = sig9[j++];
  const hist = line.map((v, i) => (v != null && signal[i] != null ? v - signal[i] : null));
  return { line, signal, hist };
};

const bollinger = (vals, p = 20, mult = 2) => {
  const mid = sma(vals, p);
  const upper = new Array(vals.length).fill(null);
  const lower = new Array(vals.length).fill(null);
  for (let i = p - 1; i < vals.length; i++) {
    const slice = vals.slice(i - p + 1, i + 1);
    const m = mid[i];
    const sd = Math.sqrt(slice.reduce((a, b) => a + (b - m) ** 2, 0) / p);
    upper[i] = m + mult * sd;
    lower[i] = m - mult * sd;
  }
  return { mid, upper, lower };
};

const annualizedVol = (closes) => {
  const rets = [];
  for (let i = 1; i < closes.length; i++) rets.push(Math.log(closes[i] / closes[i - 1]));
  const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
  const variance = rets.reduce((a, b) => a + (b - mean) ** 2, 0) / (rets.length - 1);
  return Math.sqrt(variance) * Math.sqrt(252) * 100;
};

/* ------------------------------------------------------------------ */
/*  Signal engine                                                      */
/* ------------------------------------------------------------------ */

const buildSignals = (d) => {
  const out = [];
  const last = d.length - 1;
  const px = d[last].close;

  // Trend vs moving averages
  if (d[last].sma50 != null && d[last].sma200 != null) {
    const golden = d[last].sma50 > d[last].sma200;
    out.push({
      name: "MA Trend (50/200)",
      verdict: golden ? "bull" : "bear",
      detail: golden
        ? "SMA-50 above SMA-200 — golden-cross regime"
        : "SMA-50 below SMA-200 — death-cross regime",
    });
  }
  if (d[last].sma50 != null) {
    const above = px > d[last].sma50;
    out.push({
      name: "Price vs SMA-50",
      verdict: above ? "bull" : "bear",
      detail: `Last close ${above ? "above" : "below"} the 50-period mean`,
    });
  }

  // RSI
  if (d[last].rsi != null) {
    const r = d[last].rsi;
    let v = "neutral", t = "Momentum balanced (30–70)";
    if (r >= 70) { v = "bear"; t = `Overbought (RSI ${r.toFixed(1)})`; }
    else if (r <= 30) { v = "bull"; t = `Oversold (RSI ${r.toFixed(1)})`; }
    out.push({ name: "RSI-14", verdict: v, detail: t });
  }

  // MACD
  if (d[last].macd != null && d[last].macdSignal != null) {
    const above = d[last].macd > d[last].macdSignal;
    // recent cross?
    let crossed = false;
    if (last > 0 && d[last - 1].macd != null && d[last - 1].macdSignal != null) {
      const prevAbove = d[last - 1].macd > d[last - 1].macdSignal;
      crossed = prevAbove !== above;
    }
    out.push({
      name: "MACD (12/26/9)",
      verdict: above ? "bull" : "bear",
      detail: `${above ? "Bullish" : "Bearish"}${crossed ? " — fresh crossover" : " histogram"}`,
    });
  }

  // Bollinger
  if (d[last].bbUpper != null) {
    let v = "neutral", t = "Inside the bands";
    if (px > d[last].bbUpper) { v = "bear"; t = "Closed above upper band — stretched"; }
    else if (px < d[last].bbLower) { v = "bull"; t = "Closed below lower band — washed out"; }
    out.push({ name: "Bollinger (20,2)", verdict: v, detail: t });
  }

  return out;
};

/* ------------------------------------------------------------------ */
/*  Screener: per-ticker setup score                                   */
/*  Thesis = oversold RSI + negative MACD, sitting on a Fibonacci      */
/*  retracement / key EMA — a mechanical "pullback into support" scan. */
/* ------------------------------------------------------------------ */

/* Estimated buy/sell volume split (heuristic from close-in-range — NOT real
   order flow, which needs tick/quote data unavailable on OHLCV bars). */
const estBuySell = (values, win = 10) => {
  const w = values.slice(-win);
  let bv = 0, sv = 0;
  for (const v of w) {
    const rng = (v.high - v.low) || 1;
    const frac = Math.min(1, Math.max(0, (v.close - v.low) / rng));
    bv += v.volume * frac; sv += v.volume * (1 - frac);
  }
  const tot = bv + sv;
  return { buyVol: bv, sellVol: sv, buyPct: tot ? (bv / tot) * 100 : 50 };
};

const screenTicker = (values) => {
  const closes = values.map((v) => v.close);
  const n = closes.length;
  if (n < 60) return null;

  const r14 = rsi(closes, 14);
  const m = macd(closes);
  const e20 = ema(closes, 20), e50 = ema(closes, 50);

  const price = closes[n - 1];
  const rsiV = r14[n - 1], rsiPrev = r14[n - 2];
  const macdLine = m.line[n - 1], macdSig = m.signal[n - 1], macdHist = m.hist[n - 1];
  const histPrev = m.hist[n - 2];
  const macdRising = macdHist != null && histPrev != null && macdHist > histPrev;
  const ema20 = e20[n - 1], ema50 = e50[n - 1];

  // Fibonacci retracement over the recent swing
  const LB = Math.min(120, n);
  const slice = values.slice(-LB);
  const swingHi = Math.max(...slice.map((v) => v.high));
  const swingLo = Math.min(...slice.map((v) => v.low));
  const range = (swingHi - swingLo) || 1;
  const fibPos = (swingHi - price) / range; // 0 = at swing high, 1 = at swing low
  const fibZone =
    fibPos < 0.236 ? "near highs" :
    fibPos < 0.45 ? "shallow 0.236–0.382" :
    fibPos <= 0.70 ? "golden pocket 0.5–0.618" :
    fibPos <= 0.90 ? "deep 0.618–0.786" : "near lows";

  // nearest Fibonacci level + signed distance (entry/risk reference)
  const ratios = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
  let nearest = null;
  for (const rr of ratios) {
    const lp = swingHi - range * rr;
    if (nearest == null || Math.abs(lp - price) < Math.abs(nearest.price - price)) nearest = { r: rr, price: lp };
  }
  const fibNearLabel = nearest.r === 0 ? "0%" : nearest.r === 1 ? "100%" : (+(nearest.r * 100).toFixed(1)).toString() + "%";
  const fibDistPct = ((price - nearest.price) / price) * 100; // + above level, - below

  // Volume: relative participation + estimated buy/sell tilt
  const vols = values.map((v) => v.volume);
  const recentVol = vols.slice(-5).reduce((a, b) => a + b, 0) / Math.min(5, vols.length);
  const baseVol = vols.slice(-50).reduce((a, b) => a + b, 0) / Math.min(50, vols.length);
  const relVol = baseVol ? recentVol / baseVol : 1;
  const { buyPct } = estBuySell(values, 10);
  const volConfirm = relVol > 1.2;          // elevated participation
  const accumulation = buyPct > 55;         // buyers stepping in despite the dip

  const oversold = rsiV != null && rsiV < 40;
  const deepOversold = rsiV != null && rsiV < 30;
  const macdNeg = macdHist != null && macdHist < 0;
  const atFib = fibPos >= 0.45 && fibPos <= 0.70;
  const emaNear = ema50 != null && Math.abs(price - ema50) / ema50 < 0.04;
  const rsiTurningUp = rsiV != null && rsiPrev != null && rsiV > rsiPrev;

  let score = 0;
  if (oversold) score += 2;
  if (deepOversold) score += 1;
  if (macdNeg) score += 1;
  if (atFib) score += 2;
  if (emaNear) score += 1;
  if (rsiTurningUp) score += 1;
  if (volConfirm) score += 1;
  if (accumulation) score += 1;
  const label = score >= 7 ? "STRONG" : score >= 5 ? "WATCH" : "—";

  return {
    price, rsi: rsiV, macdHist, macdRising, ema50,
    fibPos, fibZone, fibNearLabel, fibDistPct, swingHi, swingLo,
    relVol, buyPct, volConfirm, accumulation,
    oversold, deepOversold, macdNeg, atFib, emaNear, rsiTurningUp,
    score, label,
  };
};

/* Multi-timeframe combine: daily sets the setup (HTF context), 4-hour times
   the turn (LTF confirmation). Confirmation counts 4h RSI turning up, 4h MACD
   histogram rising, and a 4h buy-volume tilt. */
const combineTF = (daily, h4) => {
  const dScore = daily.score;
  let conf = 0;
  const has4 = !!h4;
  if (has4) {
    conf = (h4.rsiTurningUp ? 1 : 0) + (h4.macdRising ? 1 : 0) + (h4.buyPct > 52 ? 1 : 0);
  }
  let verdict;
  if (dScore >= 5 && has4 && conf >= 2) verdict = "ALIGNED";
  else if ((dScore >= 5 && has4 && conf >= 1) || (dScore >= 3 && has4 && conf >= 2)) verdict = "WATCH";
  else if (dScore >= 5) verdict = has4 ? "WAIT" : "WATCH"; // HTF ready; LTF not confirming
  else verdict = "—";
  return { dScore, h4Confirm: has4 ? conf : null, verdict, combinedScore: dScore + conf };
};

/* ------------------------------------------------------------------ */
/*  Presentation helpers                                               */
/* ------------------------------------------------------------------ */

const C = {
  bg: "#0a0d0c",
  panel: "#111614",
  panelAlt: "#0d1110",
  line: "#1d2522",
  text: "#e8efe9",
  dim: "#7c8a82",
  faint: "#566059",
  acc: "#c2f24a",     // phosphor lime
  up: "#3ddc84",
  down: "#ff5d52",
  blue: "#5bc8ff",
  amber: "#ffc24b",
};

const fmt = (n, dp = 2) =>
  n == null || isNaN(n) ? "—" : n.toLocaleString(undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp });

const INTERVALS = [
  { id: "1day", label: "1D" },
  { id: "1week", label: "1W" },
  { id: "4hour", label: "4H" },
  { id: "1hour", label: "1H" },
  { id: "30min", label: "30M" },
];
const ivLabel = (id) => (INTERVALS.find((i) => i.id === id) || {}).label || id;

// Editable starting universe — current US mega-caps (mid-2026). Not a live
// market-cap ranking (that's not feasible on a free API tier); edit freely.
const DEFAULT_UNIVERSE = "NVDA, GOOGL, AAPL, MSFT, AMZN, META, AVGO, TSLA, WMT, LLY";

/* ------------------------------------------------------------------ */
/*  Main component                                                     */
/* ------------------------------------------------------------------ */

function QuantTerminal() {
  const [proxyUrl, setProxyUrl] = useState("https://claude-76eb.onrender.com");
  const [symbol, setSymbol] = useState("AAPL");
  const [interval, setIntervalId] = useState("1day");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [raw, setRaw] = useState(null);
  const [meta, setMeta] = useState(null);
  const [health, setHealth] = useState({ state: "unknown", provider: "" });

  // ---- screener state ----
  const [mode, setMode] = useState("single"); // "single" | "screen"
  const [universe, setUniverse] = useState(DEFAULT_UNIVERSE);
  const [screening, setScreening] = useState(false);
  const [progress, setProgress] = useState({ phase: "", done: 0, total: 0, current: "" });
  const [results, setResults] = useState(null);
  const [screenErr, setScreenErr] = useState("");
  const cancelRef = useRef(false);

  // ---- Developer-tier features ----
  const [flow, setFlow] = useState(null);          // real order flow on Analyze view
  const [uniSort, setUniSort] = useState("losers"); // market-scan criterion
  const [pulling, setPulling] = useState(false);

  const checkHealth = useCallback(async () => {
    const base = proxyUrl.trim().replace(/\/+$/, "");
    if (!base) { setHealth({ state: "unknown", provider: "" }); return; }
    setHealth((h) => ({ ...h, state: "checking" }));
    try {
      const res = await fetch(`${base}/health`);
      const json = await res.json();
      if (json && json.ok) setHealth({ state: "ok", provider: json.provider || "" });
      else setHealth({ state: "down", provider: "" });
    } catch {
      setHealth({ state: "down", provider: "" });
    }
  }, [proxyUrl]);

  // ping on load and (debounced) whenever the proxy URL changes
  useEffect(() => {
    const t = setTimeout(checkHealth, 400);
    return () => clearTimeout(t);
  }, [checkHealth]);

  const run = useCallback(async (symOverride) => {
    const sym = ((typeof symOverride === "string" && symOverride) ? symOverride : symbol).trim().toUpperCase();
    const base = proxyUrl.trim().replace(/\/+$/, "");
    if (!base) { setErr("Enter your proxy URL first (e.g. https://claude-76eb.onrender.com)."); return; }
    if (!sym) { setErr("Enter a ticker symbol."); return; }
    setLoading(true); setErr(""); setFlow(null);

    const url = `${base}/api/timeseries?symbol=${encodeURIComponent(sym)}&interval=${encodeURIComponent(interval)}`;

    let res;
    try {
      res = await fetch(url);
    } catch (netErr) {
      setErr("Couldn't reach the proxy. Is it running, and is the URL right? (Check the /health endpoint, and ALLOWED_ORIGIN on the server.)");
      setHealth({ state: "down", provider: "" });
      setRaw(null); setLoading(false);
      return;
    }
    try {
      const json = await res.json();
      // The proxy returns { error } on failure (rate limit, bad symbol, key not set, ...).
      if (json.error) throw new Error(json.error);
      if (!json.values || !json.values.length) throw new Error("No data returned for that symbol/interval.");

      // Already normalized + oldest-first by the proxy.
      const values = json.values
        .map((v) => ({
          datetime: v.datetime,
          open: +v.open, high: +v.high, low: +v.low, close: +v.close,
          volume: v.volume ? +v.volume : 0,
        }))
        .slice(-400);

      setRaw(values);
      setMeta({ symbol: json.symbol || sym, provider: json.provider || "" });
      setHealth({ state: "ok", provider: json.provider || "" });
    } catch (e) {
      setErr(e.message || "Request failed.");
      setRaw(null);
    } finally {
      setLoading(false);
    }
  }, [proxyUrl, symbol, interval]);

  // throttled scan across the universe (one ticker at a time)
  // Two-pass scan: daily on everything, then 4-hour confirmation on daily setups.
  const runScreen = useCallback(async () => {
    const base = proxyUrl.trim().replace(/\/+$/, "");
    if (!base) { setScreenErr("Enter your proxy URL first."); return; }
    const syms = [...new Set(universe.split(/[\s,]+/).map((s) => s.trim().toUpperCase()).filter(Boolean))];
    if (!syms.length) { setScreenErr("Add at least one ticker to the watchlist."); return; }

    setScreening(true); setScreenErr(""); setResults(null);
    cancelRef.current = false;
    const DELAY = 150; // Developer tier: high rate limit, so just a gentle gap

    const pull = async (sym, iv) => {
      try {
        const res = await fetch(`${base}/api/timeseries?symbol=${encodeURIComponent(sym)}&interval=${iv}`);
        const json = await res.json();
        if (json.error) return { error: json.error };
        if (!json.values || !json.values.length) return { error: "no data" };
        setHealth({ state: "ok", provider: json.provider || "" });
        return { values: json.values.map((v) => ({ datetime: v.datetime, open: +v.open, high: +v.high, low: +v.low, close: +v.close, volume: v.volume ? +v.volume : 0 })) };
      } catch { setHealth({ state: "down", provider: "" }); return { error: "fetch failed" }; }
    };

    // Pass 1 — daily on the whole watchlist
    const rows = [];
    for (let i = 0; i < syms.length; i++) {
      if (cancelRef.current) break;
      const sym = syms[i];
      setProgress({ phase: "Daily scan", done: i, total: syms.length, current: sym });
      const d = await pull(sym, "1day");
      if (d.error) rows.push({ symbol: sym, error: d.error });
      else {
        const dm = screenTicker(d.values);
        rows.push(dm ? { symbol: sym, daily: dm } : { symbol: sym, error: "not enough history" });
      }
      if (i < syms.length - 1 && !cancelRef.current) await new Promise((r) => setTimeout(r, DELAY));
    }

    // Pass 2 — 4-hour confirmation only on names that already show a daily setup
    const qualifiers = rows.filter((r) => !r.error && r.daily.score >= 4);
    for (let j = 0; j < qualifiers.length; j++) {
      if (cancelRef.current) break;
      const q = qualifiers[j];
      setProgress({ phase: "4H confirm", done: j, total: qualifiers.length, current: q.symbol });
      await new Promise((r) => setTimeout(r, DELAY)); // space from the previous call
      if (cancelRef.current) break;
      const h = await pull(q.symbol, "4hour");
      if (!h.error) { const hm = screenTicker(h.values); if (hm) q.h4 = hm; else q.h4err = "not enough 4h history"; }
      else q.h4err = h.error;
    }

    // Combine timeframes + finalize
    const out = rows.map((r) => {
      if (r.error) return r;
      const c = combineTF(r.daily, r.h4 || null);
      return { symbol: r.symbol, ...r.daily, h4: r.h4 || null, h4err: r.h4err || null, ...c };
    });
    out.sort((a, b) => {
      if (a.error && b.error) return 0;
      if (a.error) return 1; if (b.error) return -1;
      return (b.combinedScore || 0) - (a.combinedScore || 0);
    });
    setProgress((p) => ({ ...p, current: "" }));
    setResults(out);
    setScreening(false);
  }, [proxyUrl, universe]);

  const stopScreen = useCallback(() => { cancelRef.current = true; }, []);

  const loadFromScreen = useCallback((sym) => {
    setSymbol(sym);
    setIntervalId("1day");
    setMode("single");
    run(sym);
  }, [run]);

  // Real order flow (Polygon trades) for the current single-view symbol
  const loadFlow = useCallback(async () => {
    const base = proxyUrl.trim().replace(/\/+$/, "");
    const sym = ((meta && meta.symbol) || symbol).trim().toUpperCase();
    if (!base || !sym) return;
    setFlow({ loading: true });
    try {
      const res = await fetch(`${base}/api/flow?symbol=${encodeURIComponent(sym)}`);
      const json = await res.json();
      if (json.error) setFlow({ err: json.error });
      else setFlow({ data: json });
    } catch { setFlow({ err: "Couldn't reach the proxy for order flow." }); }
  }, [proxyUrl, meta, symbol]);

  // Fill the watchlist from a whole-market scan (Polygon snapshot)
  const pullMarket = useCallback(async () => {
    const base = proxyUrl.trim().replace(/\/+$/, "");
    if (!base) { setScreenErr("Enter your proxy URL first."); return; }
    setPulling(true); setScreenErr("");
    try {
      const res = await fetch(`${base}/api/universe?sort=${uniSort}&limit=25&minPrice=5&minVol=1000000`);
      const json = await res.json();
      if (json.error) setScreenErr(json.error);
      else if (json.tickers && json.tickers.length) setUniverse(json.tickers.map((t) => t.symbol).join(", "));
      else setScreenErr("No tickers came back from the market scan.");
    } catch { setScreenErr("Couldn't reach the proxy for the market scan."); }
    setPulling(false);
  }, [proxyUrl, uniSort]);

  /* derive indicators + chart rows */
  const model = useMemo(() => {
    if (!raw) return null;
    const closes = raw.map((r) => r.close);
    const s20 = sma(closes, 20), s50 = sma(closes, 50), s200 = sma(closes, 200);
    const e12 = ema(closes, 12), e26 = ema(closes, 26);
    const r14 = rsi(closes, 14);
    const m = macd(closes);
    const bb = bollinger(closes, 20, 2);

    const rows = raw.map((r, i) => ({
      ...r,
      idx: i,
      up: r.close >= r.open,
      wick: [r.low, r.high],
      body: [r.open, r.close],
      sma20: s20[i], sma50: s50[i], sma200: s200[i],
      ema12: e12[i], ema26: e26[i],
      rsi: r14[i],
      macd: m.line[i], macdSignal: m.signal[i], macdHist: m.hist[i],
      bbUpper: bb.upper[i], bbLower: bb.lower[i], bbMid: bb.mid[i],
      bbBand: bb.upper[i] != null ? [bb.lower[i], bb.upper[i]] : null,
    }));

    const signals = buildSignals(rows);
    const bull = signals.filter((s) => s.verdict === "bull").length;
    const bear = signals.filter((s) => s.verdict === "bear").length;
    const score = bull - bear;
    const bias = score > 1 ? "BULLISH" : score < -1 ? "BEARISH" : "NEUTRAL";

    const last = rows[rows.length - 1];
    const prev = rows[rows.length - 2] || last;
    const chg = last.close - prev.close;
    const chgPct = (chg / prev.close) * 100;
    const hi = Math.max(...raw.map((r) => r.high));
    const lo = Math.min(...raw.map((r) => r.low));
    const vol = annualizedVol(closes);
    const bs = estBuySell(raw, 10);

    // show recent window for legibility
    const view = rows.slice(-120);
    return { rows, view, signals, bias, score, last, chg, chgPct, hi, lo, vol, buyPct: bs.buyPct };
  }, [raw]);

  const tickFmt = (dt) => (dt || "").slice(5, 10);

  return (
    <div style={{ background: C.bg, color: C.text, fontFamily: "'JetBrains Mono', monospace", minHeight: 640, borderRadius: 16, overflow: "hidden", border: `1px solid ${C.line}` }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        .qt-disp { font-family: 'Bricolage Grotesque', sans-serif; }
        .qt-in::placeholder { color: ${C.faint}; }
        .qt-in:focus { outline: none; border-color: ${C.acc}; box-shadow: 0 0 0 1px ${C.acc}; }
        .qt-btn:hover { background: ${C.acc}; color: #0a0d0c; }
        .qt-pill:hover { border-color: ${C.acc}; color: ${C.acc}; }
        .qt-fade { animation: qtfade .5s ease both; }
        @keyframes qtfade { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }
        .qt-scroll::-webkit-scrollbar { height:8px; width:8px;}
        .qt-scroll::-webkit-scrollbar-thumb { background:${C.line}; border-radius:8px;}
      `}</style>

      {/* ---- Header ---- */}

        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 36, height: 36, borderRadius: 9, background: C.acc, display: "grid", placeItems: "center", boxShadow: `0 0 22px ${C.acc}55` }}>
            <Zap size={20} color="#0a0d0c" strokeWidth={2.5} />
          </div>
          <div>
            <div className="qt-disp" style={{ fontSize: 19, fontWeight: 800, letterSpacing: -0.4 }}>
              QUANT<span style={{ color: C.acc }}>·</span>TERMINAL
            </div>
            <div style={{ fontSize: 10.5, color: C.dim, letterSpacing: 1.5, textTransform: "uppercase" }}>
              Live technical analysis
            </div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <StatusPill health={health} onClick={checkHealth} />
          {model && (
            <div style={{ textAlign: "right" }} className="qt-fade">
              <div className="qt-disp" style={{ fontSize: 22, fontWeight: 700 }}>{meta?.symbol || symbol}</div>
              <div style={{ fontSize: 11, color: C.dim }}>{meta?.provider || "via proxy"} · {ivLabel(interval)}</div>
            </div>

        </div>
      </div>

      {/* ---- Mode toggle ---- */}
      <div style={{ display: "flex", gap: 4, padding: "12px 24px 0", background: C.panelAlt }}>
        {[["single", "Analyze", Activity], ["screen", "Screener", Filter]].map(([id, label, Icon]) => (

      {mode === "single" && (<>

            <input

        {err && (

          <div style={{ fontSize: 13, maxWidth: 420, margin: "0 auto", lineHeight: 1.6 }}>

            <Stat label="Ann. Vol" value={`${fmt(model.vol, 1)}%`} color={C.amber} />

          {/* bias badge */}
          <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18, flexWrap: "wrap" }}>
            <BiasBadge bias={model.bias} />
            <div style={{ fontSize: 12, color: C.dim }}>
              Composite of {model.signals.length} signals · score {model.score >= 0 ? "+" : ""}{model.score}
            </div>
          </div>

          {/* real order flow */}
          <FlowPanel flow={flow} onLoad={loadFlow} />

          {/* price chart */}
          <Panel title="PRICE · CANDLES + SMA(20/50/200) + BOLLINGER(20,2)">
            <ResponsiveContainer width="100%" height={300}>
              <ComposedChart data={model.view} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={C.line} vertical={false} />
                <XAxis dataKey="datetime" tickFormatter={tickFmt} tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} minTickGap={32} />
                <YAxis domain={["auto", "auto"]} tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} width={52} orientation="right" />
                <Tooltip content={<PriceTip />} />
                <Area dataKey="bbBand" stroke="none" fill={C.blue} fillOpacity={0.06} isAnimationActive={false} connectNulls />
                <Line dataKey="bbUpper" stroke={C.blue} strokeWidth={1} dot={false} strokeDasharray="3 3" isAnimationActive={false} connectNulls />
                <Line dataKey="bbLower" stroke={C.blue} strokeWidth={1} dot={false} strokeDasharray="3 3" isAnimationActive={false} connectNulls />
                <Bar dataKey="wick" barSize={1.5} isAnimationActive={false}>
                  {model.view.map((d, i) => <Cell key={i} fill={d.up ? C.up : C.down} />)}
                </Bar>
                <Bar dataKey="body" barSize={5} isAnimationActive={false}>
                  {model.view.map((d, i) => <Cell key={i} fill={d.up ? C.up : C.down} />)}
                </Bar>
                <Line dataKey="sma20" stroke={C.acc} strokeWidth={1.4} dot={false} isAnimationActive={false} connectNulls />
                <Line dataKey="sma50" stroke={C.amber} strokeWidth={1.4} dot={false} isAnimationActive={false} connectNulls />
                <Line dataKey="sma200" stroke="#b07cff" strokeWidth={1.4} dot={false} isAnimationActive={false} connectNulls />
              </ComposedChart>
            </ResponsiveContainer>
            <Legend2 items={[["SMA-20", C.acc], ["SMA-50", C.amber], ["SMA-200", "#b07cff"], ["Bands", C.blue]]} />
          </Panel>

          {/* volume */}
          <Panel title="VOLUME">
            <ResponsiveContainer width="100%" height={110}>
              <ComposedChart data={model.view} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                <XAxis dataKey="datetime" tickFormatter={tickFmt} tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} minTickGap={32} />
                <YAxis tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} width={52} orientation="right" tickFormatter={(v) => v >= 1e6 ? (v / 1e6).toFixed(0) + "M" : v >= 1e3 ? (v / 1e3).toFixed(0) + "K" : v} />
                <Tooltip content={<VolTip />} />
                <Bar dataKey="volume" isAnimationActive={false}>
                  {model.view.map((d, i) => <Cell key={i} fill={d.up ? `${C.up}99` : `${C.down}99`} />)}
                </Bar>
              </ComposedChart>
            </ResponsiveContainer>
          </Panel>

          {/* RSI */}
          <Panel title="RSI · 14">
            <ResponsiveContainer width="100%" height={130}>
              <ComposedChart data={model.view} margin={{ top: 6, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={C.line} vertical={false} />
                <XAxis dataKey="datetime" tickFormatter={tickFmt} tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} minTickGap={32} />
                <YAxis domain={[0, 100]} ticks={[30, 50, 70]} tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} width={52} orientation="right" />
                <Tooltip content={<GenTip keys={[["rsi", "RSI", C.acc, 1]]} fmtX={tickFmt} />} />
                <ReferenceLine y={70} stroke={C.down} strokeDasharray="4 4" />
                <ReferenceLine y={30} stroke={C.up} strokeDasharray="4 4" />
                <Line dataKey="rsi" stroke={C.acc} strokeWidth={1.6} dot={false} isAnimationActive={false} connectNulls />
              </ComposedChart>
            </ResponsiveContainer>
          </Panel>

          {/* MACD */}
          <Panel title="MACD · 12 / 26 / 9">
            <ResponsiveContainer width="100%" height={130}>
              <ComposedChart data={model.view} margin={{ top: 6, right: 8, left: 0, bottom: 0 }}>
                <CartesianGrid stroke={C.line} vertical={false} />
                <XAxis dataKey="datetime" tickFormatter={tickFmt} tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} minTickGap={32} />
                <YAxis tick={{ fill: C.dim, fontSize: 10 }} stroke={C.line} width={52} orientation="right" />
                <Tooltip content={<GenTip keys={[["macd", "MACD", C.acc, 3], ["macdSignal", "Signal", C.amber, 3], ["macdHist", "Hist", C.dim, 3]]} fmtX={tickFmt} />} />
                <ReferenceLine y={0} stroke={C.faint} />
                <Bar dataKey="macdHist" isAnimationActive={false}>
                  {model.view.map((d, i) => <Cell key={i} fill={(d.macdHist || 0) >= 0 ? `${C.up}aa` : `${C.down}aa`} />)}
                </Bar>
                <Line dataKey="macd" stroke={C.acc} strokeWidth={1.5} dot={false} isAnimationActive={false} connectNulls />
                <Line dataKey="macdSignal" stroke={C.amber} strokeWidth={1.5} dot={false} isAnimationActive={false} connectNulls />
              </ComposedChart>
            </ResponsiveContainer>
          </Panel>

          {/* signals */}
          <div style={{ marginTop: 22 }}>
            <SectionLabel>SIGNAL BREAKDOWN <span style={{ color: C.faint, fontWeight: 400, textTransform: "none", letterSpacing: 0 }}>· tap a card for why</span></SectionLabel>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: 10, marginTop: 12 }}>
              {model.signals.map((s, i) => <SignalCard key={i} s={s} />)}
            </div>
          </div>

          <div style={{ marginTop: 22, fontSize: 11, color: C.faint, lineHeight: 1.6, borderTop: `1px solid ${C.line}`, paddingTop: 14 }}>
            Indicators are descriptive, computed from delayed/EOD data depending on your plan. This is an
            analysis tool, not investment advice — signals are mechanical rules, not recommendations.
          </div>
        </div>
      )}
      </>)}

      {mode === "screen" && (
        <div style={{ padding: 24 }}>
          <div style={{ background: C.panelAlt, border: `1px solid ${C.line}`, borderRadius: 14, padding: 16, marginBottom: 18 }}>
            <SectionLabel>WATCHLIST</SectionLabel>
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8, marginBottom: 4, flexWrap: "wrap" }}>
              <span style={{ fontSize: 11, color: C.dim }}>Fill from market scan:</span>
              <div style={{ display: "flex", gap: 4, background: C.bg, padding: 4, borderRadius: 9, border: `1px solid ${C.line}` }}>
                {[["losers", "Top Losers"], ["gainers", "Top Gainers"], ["active", "Most Active"]].map(([id, label]) => (
                  <button key={id} onClick={() => setUniSort(id)}
                    style={{ border: "1px solid transparent", background: uniSort === id ? C.acc : "transparent", color: uniSort === id ? "#0a0d0c" : C.dim, padding: "5px 10px", borderRadius: 6, fontSize: 11.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                    {label}
                  </button>
                ))}
              </div>
              <button onClick={pullMarket} disabled={pulling}
                style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.acc, border: `1px solid ${C.acc}55`, padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: pulling ? "wait" : "pointer", fontFamily: "inherit" }}>
                {pulling ? <Loader2 size={14} style={{ animation: "spin 1s linear infinite" }} /> : <Activity size={14} />}
                {pulling ? "Pulling…" : "Pull 25"}
              </button>
            </div>
            <textarea
              value={universe}
              onChange={(e) => setUniverse(e.target.value)}
              spellCheck={false}
              rows={2}
              style={{
                width: "100%", marginTop: 8, background: "#0a0d0c", border: `1px solid ${C.line}`,
                borderRadius: 10, color: C.text, padding: "10px 12px", fontSize: 13, letterSpacing: 0.5,
                fontFamily: "'JetBrains Mono', monospace", boxSizing: "border-box", resize: "vertical",
              }}
            />
            <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 12, flexWrap: "wrap" }}>
              {!screening ? (
                <button className="qt-btn" onClick={runScreen}
                  style={{ display: "flex", alignItems: "center", gap: 8, background: C.acc, color: "#0a0d0c", border: "none", padding: "0 20px", height: 40, borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>
                  <Filter size={16} /> Run Screen
                </button>
              ) : (
                <button onClick={stopScreen}
                  style={{ display: "flex", alignItems: "center", gap: 8, background: C.down, color: "#0a0d0c", border: "none", padding: "0 20px", height: 40, borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>
                  <Loader2 size={16} style={{ animation: "spin 1s linear infinite" }} /> Stop
                </button>
              )}
              {screening && (
                <span style={{ fontSize: 12.5, color: C.dim }}>
                  {progress.phase || "Scanning"} {Math.min(progress.done + 1, progress.total)}/{progress.total}
                  {progress.current ? ` · ${progress.current}` : ""} — throttled to ~5/min.
                </span>

            </div>
            {screenErr && (
              <div style={{ marginTop: 12, display: "flex", gap: 8, alignItems: "center", color: C.down, fontSize: 12.5 }}>
                <AlertCircle size={15} /> {screenErr}

          {results && <ScreenerTable results={results} onPick={loadFromScreen} />}

          {!results && !screening && (
            <div style={{ padding: "40px 0", textAlign: "center", color: C.dim, fontSize: 13, lineHeight: 1.6 }}>
              Scans each ticker's daily chart for a <span style={{ color: C.acc }}>pullback-into-support</span> setup
              (oversold RSI + negative MACD in the Fibonacci golden pocket near the 50-EMA), then confirms timing on the
              <span style={{ color: C.acc }}> 4-hour</span> (RSI turning up, MACD histogram rising, buy-volume tilt).
              <span style={{ color: C.text }}> ALIGNED</span> = both agree; <span style={{ color: C.text }}>WAIT</span> = daily ready, 4h not yet.
            </div>
          )}

          <div style={{ marginTop: 22, fontSize: 11, color: C.faint, lineHeight: 1.6, borderTop: `1px solid ${C.line}`, paddingTop: 14 }}>
            Use <b>Pull 25</b> to seed the watchlist from a live whole-market scan (top losers suit a reversal hunt), edit freely, then Run Screen.
            Each name gets a daily scan plus a 4-hour confirmation when it shows a daily setup. Scores are mechanical multi-timeframe pattern flags, <b>not</b> predictions or investment advice.
          </div>
        </div>
      )}
    </div>
  );
}

  width: "100%", height: h, background: "#0a0d0c", border: `1px solid ${C.line}`,

function StatusPill({ health, onClick }) {
  const map = {
    ok: { c: C.up, label: health.provider ? `proxy · ${health.provider}` : "proxy online", pulse: false },
    down: { c: C.down, label: "proxy offline", pulse: false },
    checking: { c: C.amber, label: "checking…", pulse: true },
    unknown: { c: C.faint, label: "no proxy URL", pulse: false },
  };
  const s = map[health.state] || map.unknown;
  return (
    <button
      onClick={onClick}
      title="Click to re-check the proxy"
      style={{
        display: "flex", alignItems: "center", gap: 8, background: `${s.c}14`,
        border: `1px solid ${s.c}44`, color: s.c, padding: "6px 11px", borderRadius: 999,
        fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 0.3,
      }}>
      <span style={{
        width: 8, height: 8, borderRadius: 999, background: s.c, display: "inline-block",
        boxShadow: `0 0 8px ${s.c}`, animation: s.pulse ? "qtpulse 1s ease-in-out infinite" : "none",
      }} />
      {s.label}
      <style>{`@keyframes qtpulse{0%,100%{opacity:1}50%{opacity:.3}}`}</style>
    </button>
  );
}

function FlowPanel({ flow, onLoad }) {
  const btn = { background: C.text, color: "#0a0d0c", border: "none", padding: "7px 14px", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" };
  const d = flow && flow.data;
  const fmtT = (ms) => ms ? new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
  const buy = d ? Math.max(0, Math.min(100, d.buyPct)) : 0;
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
        <SectionLabel>REAL ORDER FLOW{d ? (d.method === "lee-ready" ? " · QUOTE-MATCHED" : " · TICK-RULE") : ""}</SectionLabel>
        {!flow && <button onClick={onLoad} style={btn}>Load buy/sell flow</button>}
        {flow && flow.loading && (
          <span style={{ fontSize: 12, color: C.dim, display: "flex", gap: 6, alignItems: "center" }}>
            <Loader2 size={14} style={{ animation: "spin 1s linear infinite" }} /> classifying recent trades…
          </span>
        )}
        {flow && flow.err && <button onClick={onLoad} style={btn}>retry</button>}
      </div>
      {flow && flow.err && (
        <div style={{ marginTop: 10, color: C.down, fontSize: 12.5, display: "flex", gap: 8, alignItems: "center" }}>
          <AlertCircle size={15} /> {flow.err}
        </div>
      )}
      {d && (
        <div style={{ marginTop: 12 }}>
          <div style={{ display: "flex", height: 16, borderRadius: 8, overflow: "hidden", border: `1px solid ${C.line}` }}>
            <div style={{ width: `${buy}%`, background: C.up }} />
            <div style={{ width: `${100 - buy}%`, background: C.down }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 12.5 }}>
            <span style={{ color: C.up, fontWeight: 700 }}>Buy {fmt(d.buyPct, 1)}%</span>
            <span style={{ color: C.down, fontWeight: 700 }}>Sell {fmt(100 - d.buyPct, 1)}%</span>
          </div>
          <div style={{ marginTop: 8, fontSize: 11, color: C.dim, lineHeight: 1.5 }}>
            {d.method === "lee-ready" ? (
              <>{d.trades.toLocaleString()} trades matched to {(d.quotes || 0).toLocaleString()} NBBO quotes · {fmt(d.quoteClassifiedPct || 0, 0)}% quote-classified{d.tickFallback ? ` · ${d.tickFallback.toLocaleString()} via tick rule` : ""}</>
            ) : (
              <>{d.trades.toLocaleString()} trades · classified by tick rule (upgrade your Polygon tier to NBBO quotes for quote-matched precision)</>
            )}
            <br />
            buy {Math.round(d.buyVol).toLocaleString()} sh vs sell {Math.round(d.sellVol).toLocaleString()} sh · window {fmtT(d.fromMs)} → {fmtT(d.toMs)}
          </div>
          {d.participant && (() => {
            const p = d.participant;
            const inst = Math.max(0, Math.min(100, p.instPct));
            const ret = Math.max(0, Math.min(100, p.retailPct));
            const mid = Math.max(0, 100 - inst - ret);
            const leanColor = (pct) => pct > 55 ? C.up : pct < 45 ? C.down : C.text;
            const chip = (label, color, pct) => (
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: color, display: "inline-block" }} />
                {label} {fmt(pct, 0)}%
              </span>
            );
            return (
              <div style={{ marginTop: 14, borderTop: `1px solid ${C.line}`, paddingTop: 12 }}>
                <div style={{ fontSize: 10.5, color: C.dim, letterSpacing: 1, textTransform: "uppercase", fontWeight: 700, marginBottom: 7 }}>
                  Participant mix (est)
                </div>
                <div style={{ display: "flex", height: 14, borderRadius: 7, overflow: "hidden", border: `1px solid ${C.line}` }}>
                  <div style={{ width: `${inst}%`, background: C.blue }} title={`Institutional ~${fmt(inst, 0)}%`} />
                  <div style={{ width: `${ret}%`, background: C.amber }} title={`Retail ~${fmt(ret, 0)}%`} />
                  <div style={{ width: `${mid}%`, background: C.faint }} title={`Unclassified ~${fmt(mid, 0)}%`} />
                </div>
                <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 8, fontSize: 11.5, color: C.dim }}>
                  {chip("Institutional", C.blue, inst)}
                  {chip("Retail", C.amber, ret)}
                  {chip("Unclassified", C.faint, mid)}
                </div>
                <div style={{ marginTop: 8, fontSize: 11.5, color: C.dim }}>
                  Directional lean — institutional <span style={{ color: leanColor(p.instBuyPct), fontWeight: 700 }}>{fmt(p.instBuyPct, 0)}% buy</span>
                  {" · "}retail <span style={{ color: leanColor(p.retailBuyPct), fontWeight: 700 }}>{fmt(p.retailBuyPct, 0)}% buy</span>
                </div>
                <div style={{ marginTop: 7, fontSize: 10.5, color: C.faint, lineHeight: 1.5 }}>
                  Estimated from trade size + sub-penny prints — public feeds don't tag counterparties, so treat this as a lean, not a fact.
                </div>
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

function ScreenerTable({ results, onPick }) {
  const okRows = results.filter((r) => !r.error);
  const errRows = results.filter((r) => r.error);
  const badge = (v) => {
    const map = { ALIGNED: C.acc, WATCH: C.amber, WAIT: C.blue, "—": C.faint };
    const c = map[v] || C.faint;
    const filled = v === "ALIGNED" || v === "WATCH";
    return (
      <span style={{
        color: v === "—" ? C.faint : (filled ? "#0a0d0c" : c),
        background: v === "—" ? "transparent" : (filled ? c : `${c}22`),
        border: `1px solid ${c}`, padding: "2px 8px", borderRadius: 999, fontSize: 10, fontWeight: 800, letterSpacing: 0.5,
      }}>{v}</span>
    );
  };
  const th = { textAlign: "left", padding: "8px 10px", fontSize: 10, color: C.dim, textTransform: "uppercase", letterSpacing: 1, fontWeight: 700, borderBottom: `1px solid ${C.line}`, whiteSpace: "nowrap" };
  const thR = { ...th, textAlign: "right" };
  const td = { padding: "10px", fontSize: 12.5, borderBottom: `1px solid ${C.line}`, whiteSpace: "nowrap" };
  return (
    <div className="qt-scroll" style={{ overflowX: "auto", border: `1px solid ${C.line}`, borderRadius: 12 }}>
      <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 1040 }}>
        <thead><tr>
          <th style={th}>Ticker</th><th style={th}>Setup</th><th style={th}>4H (n/3)</th><th style={thR}>Score</th>
          <th style={thR}>Price</th><th style={thR}>RSI</th><th style={thR}>MACD h</th>
          <th style={th}>Fib zone</th><th style={th}>Next Fib</th><th style={thR}>vs EMA50</th>
          <th style={thR}>Rel Vol</th><th style={thR}>Buy% (est)</th>
        </tr></thead>
        <tbody>
          {okRows.map((r) => {
            const emaPct = r.ema50 ? ((r.price - r.ema50) / r.ema50) * 100 : null;
            const hot = r.verdict !== "—";
            return (
              <tr key={r.symbol} onClick={() => onPick(r.symbol)} title="Open in Analyze"
                style={{ cursor: "pointer", background: hot ? `${C.acc}0c` : "transparent" }}>
                <td style={{ ...td, fontWeight: 700, color: hot ? C.acc : C.text }}>{r.symbol}</td>
                <td style={td}>{badge(r.verdict)}</td>
                <td style={td}>
                  {r.h4Confirm == null
                    ? (r.h4err
                        ? <span style={{ color: C.down }} title={`4h fetch failed: ${r.h4err}`}>err</span>
                        : <span style={{ color: C.faint }} title="Skipped — no daily setup">—</span>)
                    : <span title={`4h — RSI ${r.h4.rsiTurningUp ? "up" : "down"}, MACD ${r.h4.macdRising ? "rising" : "falling"}, buy ${fmt(r.h4.buyPct, 0)}%`}
                        style={{ color: r.h4Confirm >= 2 ? C.acc : r.h4Confirm === 1 ? C.amber : C.dim }}>
                        {r.h4Confirm}/3 {r.h4.rsiTurningUp ? "R↑" : "R↓"} {r.h4.macdRising ? "M↑" : "M↓"}
                      </span>}
                </td>
                <td style={{ ...td, textAlign: "right", fontWeight: 700 }}>{r.combinedScore}</td>
                <td style={{ ...td, textAlign: "right" }}>{fmt(r.price)}</td>
                <td style={{ ...td, textAlign: "right", color: r.rsi < 30 ? C.up : r.rsi < 40 ? C.amber : r.rsi > 70 ? C.down : C.text }}>{fmt(r.rsi, 1)}</td>
                <td style={{ ...td, textAlign: "right", color: r.macdHist >= 0 ? C.up : C.down }}>{fmt(r.macdHist, 3)}</td>
                <td style={{ ...td, color: r.atFib ? C.acc : C.dim }}>{r.fibZone}</td>
                <td style={{ ...td, color: Math.abs(r.fibDistPct) < 1 ? C.acc : C.dim }}>
                  {r.fibNearLabel} <span style={{ color: C.faint }}>({r.fibDistPct >= 0 ? "+" : ""}{fmt(r.fibDistPct, 1)}%)</span>
                </td>
                <td style={{ ...td, textAlign: "right", color: emaPct >= 0 ? C.up : C.down }}>{emaPct == null ? "—" : `${emaPct >= 0 ? "+" : ""}${fmt(emaPct, 1)}%`}</td>
                <td style={{ ...td, textAlign: "right", color: r.volConfirm ? C.acc : C.dim }}>{fmt(r.relVol, 2)}x</td>
                <td style={{ ...td, textAlign: "right", color: r.buyPct > 55 ? C.up : r.buyPct < 45 ? C.down : C.text }}>{fmt(r.buyPct, 0)}%</td>
              </tr>
            );
          })}
          {errRows.map((r) => (
            <tr key={r.symbol}><td style={{ ...td, color: C.faint }}>{r.symbol}</td><td style={{ ...td, color: C.faint }} colSpan={11}>{r.error}</td></tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Stat({ label, value, sub, color }) {
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px" }}>
      <div style={{ fontSize: 10, color: C.dim, textTransform: "uppercase", letterSpacing: 1 }}>{label}</div>
      <div className="qt-disp" style={{ fontSize: 21, fontWeight: 700, color: color || C.text, marginTop: 3 }}>{value}</div>
      {sub && <div style={{ fontSize: 11, color: color || C.dim, marginTop: 1 }}>{sub}</div>}
    </div>
  );
}

function BiasBadge({ bias }) {
  const map = {
    BULLISH: { c: C.up, Icon: TrendingUp },
    BEARISH: { c: C.down, Icon: TrendingDown },
    NEUTRAL: { c: C.dim, Icon: Minus },
  };
  const { c, Icon } = map[bias];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 9, background: `${c}18`, border: `1px solid ${c}55`, color: c, padding: "9px 16px", borderRadius: 12 }}>
      <Icon size={18} />
      <span className="qt-disp" style={{ fontSize: 16, fontWeight: 800, letterSpacing: 0.5 }}>{bias}</span>
    </div>
  );
}

function Panel({ title, children }) {
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 14px 10px", marginBottom: 16 }}>
      <SectionLabel>{title}</SectionLabel>
      <div style={{ marginTop: 8 }}>{children}</div>
    </div>
  );
}

function SectionLabel({ children }) {
  return <div style={{ fontSize: 10.5, color: C.dim, letterSpacing: 1.6, textTransform: "uppercase", fontWeight: 700 }}>{children}</div>;
}

function Legend2({ items }) {
  return (
    <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 4, paddingLeft: 4 }}>
      {items.map(([label, c]) => (
        <div key={label} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: C.dim }}>
          <span style={{ width: 14, height: 3, background: c, borderRadius: 2, display: "inline-block" }} />
          {label}
        </div>
      ))}
    </div>
  );
}

const SIGNAL_WHY = {
  "MA Trend (50/200)": "Compares the 50-period average to the 200-period average — the medium trend vs the long trend. 50 above 200 (a \"golden cross\" regime) means recent prices are stronger than the long-run average, read as an uptrend backdrop (bullish). 50 below 200 (\"death cross\") is the reverse. It's a slow, regime-level read, not an entry trigger.",
  "Price vs SMA-50": "Where the latest close sits versus its 50-period average. Above the average = price is leading its recent mean, i.e. buyers in control over the medium term (bullish). Below = sellers in control (bearish). A common dividing line for medium-term momentum.",
  "RSI-14": "RSI scores the speed of recent gains vs losses from 0–100. Above 70 = \"overbought\": the up-move may be stretched, so it's cautionary for chasing (bearish tilt). Below 30 = \"oversold\": selling may be exhausted, often where bounces start (bullish tilt). 30–70 is balanced momentum.",
  "MACD (12/26/9)": "MACD is the gap between a fast (12) and slow (26) EMA, smoothed by a 9-period signal line. MACD above its signal / a positive histogram = upward momentum building (bullish). Below = downward momentum (bearish). A fresh crossover flags a possible momentum shift.",
  "Bollinger (20,2)": "Bands sit 2 standard deviations above/below the 20-period average. A close above the upper band means price is unusually stretched high — mean-reversion risk, cautionary (bearish for chasing). Below the lower band means unusually depressed — potential snap-back (bullish). Inside the bands is a normal range.",
};

function SignalCard({ s }) {
  const [open, setOpen] = useState(false);
  const map = { bull: C.up, bear: C.down, neutral: C.dim };
  const c = map[s.verdict];
  const why = SIGNAL_WHY[s.name];
  return (
    <div onClick={() => why && setOpen((o) => !o)}
      style={{ background: C.panelAlt, border: `1px solid ${open ? c : C.line}`, borderLeft: `3px solid ${c}`, borderRadius: 10, padding: "11px 13px", cursor: why ? "pointer" : "default", transition: "border-color .15s" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <span style={{ fontSize: 12.5, fontWeight: 700 }}>{s.name}</span>
        <span style={{ fontSize: 10, fontWeight: 700, color: c, textTransform: "uppercase", letterSpacing: 1 }}>{s.verdict}</span>
      </div>
      <div style={{ fontSize: 11.5, color: C.dim, marginTop: 4, lineHeight: 1.4 }}>{s.detail}</div>
      {why && (
        <div style={{ fontSize: 10.5, color: C.faint, marginTop: 6, display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ display: "inline-block", transform: open ? "rotate(90deg)" : "none", transition: "transform .15s" }}>▸</span>
          {open ? "why this reads that way" : "why?"}
        </div>
      )}
      {open && why && (
        <div style={{ fontSize: 11.5, color: C.text, marginTop: 8, lineHeight: 1.55, borderTop: `1px solid ${C.line}`, paddingTop: 8 }}>
          {why}
        </div>
      )}
    </div>
  );
}

/* Tooltips */
function shell(children) {
  return (
    <div style={{ background: "#070a09", border: `1px solid ${C.line}`, borderRadius: 9, padding: "9px 11px", fontSize: 11.5, fontFamily: "'JetBrains Mono',monospace" }}>
      {children}
    </div>
  );
}
function PriceTip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  const row = (k, v, c) => (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 18, color: c || C.text }}>
      <span style={{ color: C.dim }}>{k}</span><span>{v}</span>
    </div>
  );
  return shell(
    <>
      <div style={{ color: C.dim, marginBottom: 5 }}>{d.datetime}</div>
      {row("O", fmt(d.open))}{row("H", fmt(d.high))}{row("L", fmt(d.low))}
      {row("C", fmt(d.close), d.up ? C.up : C.down)}
      {d.sma50 != null && row("SMA50", fmt(d.sma50), C.amber)}
    </>
  );
}
function VolTip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return shell(<><div style={{ color: C.dim, marginBottom: 4 }}>{d.datetime}</div><div>Vol {d.volume.toLocaleString()}</div></>);
}
function GenTip({ active, payload, keys, fmtX }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return shell(
    <>
      <div style={{ color: C.dim, marginBottom: 4 }}>{fmtX ? fmtX(d.datetime) : d.datetime}</div>
      {keys.map(([k, lbl, c, dp]) => d[k] != null && (
        <div key={k} style={{ display: "flex", justifyContent: "space-between", gap: 16, color: c }}>
          <span style={{ color: C.dim }}>{lbl}</span><span>{fmt(d[k], dp)}</span>
        </div>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<QuantTerminal />);
</script>
